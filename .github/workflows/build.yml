name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: shell_companion.suprx
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Install build requirements
        run: |
          set -eu
          if command -v apk >/dev/null 2>&1; then apk update && apk add cmake ninja git patch
          elif command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build git patch ca-certificates
          elif command -v pacman >/dev/null 2>&1; then pacman -Sy --noconfirm cmake ninja git patch
          fi
          for tool in cmake ninja git patch; do command -v "$tool" >/dev/null || { echo "::error::$tool missing"; exit 1; }; done
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      # Two GitHub repositories at pinned commits. Tried three times: a clone
      # that fails once is the network.
      - name: Fetch PAF headers
        run: |
          for try in 1 2 3; do
            sh vita/scripts/fetch_paf_headers.sh "$GITHUB_WORKSPACE/build-paf" && exit 0
            echo "fetch failed (try $try)"; sleep $((try * 10))
          done
          exit 1
      - name: Build
        run: |
          cmake -S vita -B build -G Ninja -DSC_PAF_INCLUDE_DIR="$GITHUB_WORKSPACE/build-paf/include"
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: shell_companion-${{ github.run_number }}
          path: |
            build/shell_companion.suprx
            LICENSE
            NOTICE.txt

  ps4-probes:
    name: PS4 probes
    runs-on: ubuntu-latest
    container:
      image: openorbisofficial/toolchain:latest
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build create-fself
        run: |
          command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)
          sh ps4/probe/get_create_fself.sh
      # The toolchain GoldHEN builds its own plugins with (its
      # GoldHEN_Plugins_Repository CI): illusion0001's fork of OpenOrbis,
      # whose create-fself, link.x and stubs differ from the official ones.
      # A PS4 loaded GoldHEN's no_share_watermark.prx and refused every
      # module built with the official toolchain. The modules and the test
      # app are built with it; its SHA-256 is logged.
      - name: GoldHEN's OpenOrbis toolchain (illusion0001's fork)
        run: |
          command -v curl >/dev/null || (apt-get update && apt-get install -y --no-install-recommends curl ca-certificates)
          mkdir -p "$RUNNER_TEMP/oo-goldhen"
          curl -sSLf -o "$RUNNER_TEMP/oo-goldhen.tar.gz" \
            https://github.com/illusion0001/OpenOrbis-PS4-Toolchain/releases/latest/download/toolchain.tar.gz
          sha256sum "$RUNNER_TEMP/oo-goldhen.tar.gz"
          tar -xzf "$RUNNER_TEMP/oo-goldhen.tar.gz" -C "$RUNNER_TEMP/oo-goldhen"
          rm "$RUNNER_TEMP/oo-goldhen.tar.gz"
          ls "$RUNNER_TEMP/oo-goldhen/OpenOrbis/PS4Toolchain/bin/linux"
      - name: Build
        run: sh ps4/probe/build.sh
      - name: Build background music and the test app (GoldHEN's toolchain)
        run: |
          export OO_PS4_TOOLCHAIN="$RUNNER_TEMP/oo-goldhen/OpenOrbis/PS4Toolchain"
          export CREATE_FSELF="$OO_PS4_TOOLCHAIN/bin/linux/create-fself"
          sh ps4/app/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ps4-probes-${{ github.run_number }}
          path: |
            build-ps4/*.pkg
            build-ps4/*.bin
            build-ps4/*.prx
            ps4/README.md
            NOTICE.txt
